    <!-- Visitor analytics: Plausible (privacy-friendly, GDPR-compliant, no cookies, no banner needed) -->
    <script defer data-domain="maryumakram16.github.io" src="https://plausible.io/js/script.js"></script>
    <script type="text/javascript" id="ghp-spa-rewrite">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Decodes the redirect from 404.html back into the real path
      // before the router mounts.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)

      // ── Stale-cache recovery ───────────────────────────────────────
      // If this page was served from a stale browser cache, the hashed
      // JS/CSS assets it references may have been deleted by a newer
      // deploy (404), leaving the page blank with no error shown.
      // Detect failed JS/CSS loads and force a fresh, cache-busting
      // reload so the visitor always lands on the newest deploy.
      window.addEventListener('error', function (e) {
        try {
          var el = e.target || e.srcElement
          if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
            var target = el.src || el.href || ''
            if (target.indexOf('/assets/') !== -1 || target.indexOf('/src/') !== -1) {
              window.location.href =
                window.location.href.split('?')[0] + '?refresh=' + Date.now()
            }
          }
        } catch (err) {}
      })
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Instant splash: visible before any JavaScript runs, so the page is never white -->
      <div id="mp-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1a2332;font-family:system-ui,sans-serif;z-index:9998">
        <h1 style="margin:0;color:#fff;font-size:28px">Maryum Akram</h1>

        <div style="width:36px;height:36px;border:3px solid #0d7a6e;border-top-color:#2fb5a2;border-radius:50%;animation:mp-spin 1s linear infinite"></div>
        <style>@keyframes mp-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <noscript>
      <div style="color:#fff;background:#1a2332;min-height:100vh;padding:48px 24px;font-family:system-ui,sans-serif">
        <h1>Maryum Akram</h1>
        <p>Please enable JavaScript to view this portfolio.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
    <script type="text/javascript">
      // Blank-page safety net: if React never mounts, show a friendly
      // fallback with a reload button instead of a permanent blank page.
      ;(function () {
        var timer = setTimeout(function () {
          var root = document.getElementById('root')
          if (root && !root.childNodes.length) {
            root.innerHTML =
              '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;background:#1a2332;font-family:system-ui,sans-serif;padding:24px;text-align:center;z-index:9999">' +
              '<h1 style="margin:0">Maryum Akram</h1>' +
              '<p style="margin:0;opacity:.85;max-width:480px">The page took too long to load — this usually means your browser is holding an old copy of the site.</p>' +
              '<button onclick="window.location.href=window.location.href.split(\'?\')[0]+\'?refresh=\'+Date.now()" style="background:#0d7a6e;color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:16px;cursor:pointer">Reload with fresh version</button>' +
              '</div>'
            clearTimeout(timer)
          }
        }, 2500)
        var obs = new MutationObserver(function () {
          var root = document.getElementById('root')
          if (root && root.childNodes.length > 1) {
            clearTimeout(timer)
            obs.disconnect()
            // remove the loading splash once React has mounted
            var splash = document.getElementById('mp-splash')
            if (splash) splash.remove()
          }
        })
        obs.observe(document.getElementById('root'), { childList: true })
      })()
    </script>
  </body>
